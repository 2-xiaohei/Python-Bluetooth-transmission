[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-bluetooth"
version = "0.2.0"
description = "Reliable BLE command service with pairing, handshake, reconnect, and resend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22,<2",
    "bless>=0.3,<1; platform_system != 'Windows'",
]

[project.scripts]
reliable-bluetooth = "reliable_bluetooth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

